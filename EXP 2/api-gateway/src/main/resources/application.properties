spring.application.name=api-gateway

server.port=8080

# Product Service - Load Balanced Route
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/products/**

# Cart Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=cart-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/cart/**

# Product Service Instances
spring.cloud.discovery.client.simple.instances.product-service[0].uri=http://localhost:8081
spring.cloud.discovery.client.simple.instances.product-service[1].uri=http://localhost:8082